<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>非正式小组 2 · 回归预告 | Momocat</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif !important; }
        html { background-color: #1a0303; }
        body {
            background-color: #1a0303;
            font-family: 'Inter', sans-serif !important;
            -webkit-font-smoothing: antialiased;
            height: 100vh; display: flex; align-items: flex-start; justify-content: center;
            overflow: hidden; color: #f8e8e8;
            --red-primary: #e63946;
            --red-dark: #7a0c1e;
            --silver: #c0c5cc;
        }

        /* 胶囊导航栏（保留） */
        .site-header {
            position: fixed;
            top: 10px; left: 50%; transform: translateX(-50%);
            width: auto; min-width: fit-content;
            padding: clamp(6px, 1.5vw, 10px) clamp(8px, 2vw, 14px);
            background-color: rgba(20, 6, 6, 0.55);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border-radius: 80px;
            border: 0.8px solid rgba(230, 57, 70, 0.3);
            box-shadow: 0 0 25px rgba(230, 57, 70, 0.2);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            gap: 0;
            flex-wrap: nowrap;
            overflow: visible;
        }
        .header-title {
            font-weight: 700; font-size: clamp(1.4rem, 3.5vw, 2rem);
            letter-spacing: -0.02em; color: #ffffff;
            padding: clamp(3px, 0.8vw, 6px) clamp(12px, 2vw, 18px);
            user-select: none; white-space: nowrap; flex-shrink: 0;
            cursor: pointer;
            z-index: 2;
            border-radius: 40px;
            transition: background-color 0.2s ease;
        }
        .header-title:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .mode-switcher {
            display: flex; align-items: center;
            background: rgba(30, 10, 10, 0.65); border-radius: 60px;
            padding: 3px;
            border: 0.5px solid rgba(230, 57, 70, 0.4);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
            flex-shrink: 0; position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.45s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.35s ease;
            pointer-events: none;
        }
        .mode-switcher.expanded {
            opacity: 1;
            max-width: 300px;
            pointer-events: auto;
            margin-left: clamp(8px, 1.5vw, 14px);
        }
        .mode-option {
            position: relative; display: flex; align-items: center;
            gap: clamp(3px, 0.5vw, 6px);
            padding: clamp(5px, 0.6vw, 8px) clamp(10px, 1.5vw, 18px);
            border-radius: 40px;
            font-size: clamp(0.7rem, 1vw, 0.9rem); font-weight: 500;
            color: #c0c5cc; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.3, 1.2);
            background: transparent; border: none; outline: none;
            user-select: none; white-space: nowrap; letter-spacing: 0.01em;
        }
        .mode-option:hover { color: #ffffff; }
        .mode-option.active {
            background: rgba(230, 57, 70, 0.3); color: #ff6b7a; font-weight: 600;
            box-shadow: 0 1px 6px rgba(230, 57, 70, 0.25);
        }
        .mode-option svg {
            width: clamp(12px, 1vw, 16px); height: clamp(12px, 1vw, 16px);
            flex-shrink: 0; display: block; transition: stroke 0.2s, fill 0.2s;
        }
        .mode-option:not([data-mode="home"]) svg * { stroke: #c0c5cc; fill: none; }
        .mode-option:not([data-mode="home"]).active svg * { stroke: #ff6b7a; fill: none; }
        .mode-option[data-mode="home"] svg * { fill: #c0c5cc; stroke: none; }
        .mode-option[data-mode="home"].active svg * { fill: #ff6b7a; stroke: none; }

        /* 主内容容器 */
        .main-content {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
            scrollbar-width: thin; scrollbar-color: #7a3a3a transparent;
            overscroll-behavior-y: contain;
            padding-bottom: 40px;
            background-color: #1a0303;
        }

        /* 回归预告 Hero - 增强炫酷效果 */
        .comeback-hero {
            width: 100%;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #4a0d16 0%, #1a0303 70%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            overflow: hidden;
        }

        /* 动态光带 */
        .light-stream {
            position: absolute;
            width: 200px;
            height: 600px;
            background: linear-gradient(180deg, rgba(230, 57, 70, 0.4) 0%, transparent 80%);
            filter: blur(40px);
            border-radius: 100px;
            transform: rotate(25deg);
            animation: streamMove 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        .light-stream:nth-child(2) {
            width: 300px;
            height: 500px;
            left: 70%;
            top: -20%;
            animation-delay: 3s;
            background: linear-gradient(180deg, rgba(255, 80, 100, 0.35) 0%, transparent 80%);
        }
        @keyframes streamMove {
            0% { transform: translate(0, 0) rotate(25deg); }
            100% { transform: translate(30px, -40px) rotate(30deg); }
        }

        /* 漂浮粒子 */
        .particle {
            position: absolute;
            background: rgba(255, 100, 120, 0.9);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatUp 6s linear infinite;
            box-shadow: 0 0 10px rgba(255, 100, 120, 0.8);
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(0.3); opacity: 0; }
        }

        /* 银色碎屑 */
        .silver-particle {
            position: absolute;
            background: rgba(192, 197, 204, 0.9);
            width: 2px;
            height: 2px;
            border-radius: 0;
            pointer-events: none;
            z-index: 0;
            animation: silverDrift 10s linear infinite;
            box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }
        @keyframes silverDrift {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { transform: translate(-20px, -80vh) rotate(360deg); opacity: 0; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .comeback-badge {
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffe0e0;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 700;
            border: 1px solid rgba(255, 200, 200, 0.25);
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.2);
            animation: badgePulse 2s ease-in-out infinite alternate;
        }
        @keyframes badgePulse {
            0% { box-shadow: 0 0 15px rgba(230, 57, 70, 0.2); }
            100% { box-shadow: 0 0 28px rgba(255, 80, 100, 0.5); }
        }

        .comeback-title {
            font-size: clamp(4rem, 13vw, 7rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(230, 57, 70, 0.9), 0 0 60px rgba(255, 80, 100, 0.5), 0 0 100px rgba(255, 0, 50, 0.3);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(230, 57, 70, 0.8), 0 0 60px rgba(255, 80, 100, 0.4); }
            100% { text-shadow: 0 0 35px rgba(255, 80, 100, 1), 0 0 80px rgba(255, 0, 50, 0.7), 0 0 120px rgba(255, 0, 0, 0.5); }
        }

        .comeback-slogan {
            font-size: clamp(1.1rem, 3.2vw, 1.5rem);
            color: #fad4d8;
            font-weight: 600;
            max-width: 540px;
            opacity: 0.95;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 30px;
        }

        .comeback-details {
            font-size: 1rem;
            color: #e8b8bd;
            max-width: 540px;
            background: rgba(20, 5, 5, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 30px;
            border-radius: 32px;
            border: 1px solid rgba(230, 57, 70, 0.3);
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.15), inset 0 0 15px rgba(255,255,255,0.05);
            line-height: 1.7;
            text-align: center;
            animation: cardGlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes cardGlow {
            0% { border-color: rgba(230, 57, 70, 0.25); box-shadow: 0 0 25px rgba(230, 57, 70, 0.1); }
            100% { border-color: rgba(255, 100, 130, 0.5); box-shadow: 0 0 45px rgba(230, 57, 70, 0.3), inset 0 0 20px rgba(255,255,255,0.08); }
        }

        .feature-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            max-width: 580px;
        }
        .feature-pill {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 197, 204, 0.2);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffcdd2;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(230, 57, 70, 0.2);
            transition: all 0.3s;
        }
        .feature-pill:hover {
            background: rgba(230, 57, 70, 0.15);
            border-color: #ff6b7a;
            box-shadow: 0 0 25px rgba(255, 80, 100, 0.4);
            transform: translateY(-2px);
        }

        .launch-info {
            font-weight: 700;
            color: #ffffff;
            background: rgba(230, 57, 70, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 34px;
            border-radius: 50px;
            font-size: 1rem;
            border: 1px solid rgba(255, 200, 200, 0.3);
            letter-spacing: 0.03em;
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.4);
            animation: launchPulse 2s infinite alternate;
        }
        @keyframes launchPulse {
            0% { box-shadow: 0 0 20px rgba(230, 57, 70, 0.3); }
            100% { box-shadow: 0 0 45px rgba(255, 80, 100, 0.6); }
        }

        @media (max-width: 600px) {
            .comeback-hero {
                padding: 24px 16px;
            }
            .hero-content {
                gap: 18px;
            }
            .comeback-details {
                padding: 18px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-title" id="headerTitle">Momocat</div>
        <div class="mode-switcher" id="modeSwitcher">
            <button class="mode-option active" data-mode="home" aria-label="主页">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3L2 12H5V21H10V15H14V21H19V12H22L12 3Z"/></svg>
                <span>主页</span>
            </button>
            <button class="mode-option" data-mode="shop" aria-label="商店">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6V21H21V6L18 2H6Z"/><path d="M3 6H21"/><path d="M16 10C16 12.5 14 14 12 14C10 14 8 12.5 8 10"/></svg>
                <span>商店</span>
            </button>
        </div>
    </header>

    <div class="main-content" id="mainContent">
        <section class="comeback-hero" id="heroSection">
            <!-- 动态光带 -->
            <div class="light-stream"></div>
            <div class="light-stream"></div>
            <!-- 粒子与银色碎屑将由JS动态生成 -->
            
            <div class="hero-content">
                <div class="comeback-badge">一年一作 · 强势回归</div>
                <h1 class="comeback-title">非正式小组 2</h1>
                <p class="comeback-slogan">
                    更新的案子 · 更糟糕的队员<br>
                    快来蹲一波更新，压压惊，压压镜。
                </p>
                <div class="feature-pills">
                    <span class="feature-pill">📁 全新剧情线</span>
                    <span class="feature-pill">🕵️ 原班人马扩编</span>
                    <span class="feature-pill">📮 秋季信箱见</span>
                    <span class="feature-pill">🎭 更荒诞的日常</span>
                </div>
                <div class="comeback-details">
                    去年那帮“非正式”的家伙又回来了。<br>
                    这个八月，在 <strong>momocat.online</strong> 准时开更。<br>
                    故事更离谱，推理更随意，友情更坚固。<br>
                    提前收藏，别掉队。
                </div>
                <div class="launch-info">🔥 2026年8月 · 即将上线</div>
                <!-- 订阅按钮已删除 -->
            </div>
        </section>
        <!-- 语言选择板块已删除 -->
    </div>

    <script>
        (function() {
            // 胶囊导航控制
            const switcher = document.getElementById('modeSwitcher');
            const header = document.querySelector('.site-header');
            header.addEventListener('mouseenter', () => {
                switcher.classList.add('expanded');
            });
            header.addEventListener('mouseleave', () => {
                switcher.classList.remove('expanded');
            });

            const options = document.querySelectorAll('.mode-option');
            function setMode(mode) {
                options.forEach(btn => {
                    const isActive = btn.dataset.mode === mode;
                    btn.classList.toggle('active', isActive);
                });
                if (mode === 'home') {
                    document.getElementById('mainContent').scrollTo({ top: 0, behavior: 'smooth' });
                } else if (mode === 'shop') {
                    window.location.href = 'store';
                }
            }
            options.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const mode = this.dataset.mode;
                    if (this.classList.contains('active')) return;
                    setMode(mode);
                });
            });
            setMode('home');

            // 动态粒子效果生成
            const hero = document.getElementById('heroSection');
            // 红色粒子
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-20px';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                hero.appendChild(particle);
            }
            // 银色碎屑
            for (let i = 0; i < 30; i++) {
                const silver = document.createElement('div');
                silver.className = 'silver-particle';
                silver.style.left = Math.random() * 100 + '%';
                silver.style.bottom = '-20px';
                silver.style.animationDuration = (Math.random() * 8 + 6) + 's';
                silver.style.animationDelay = Math.random() * 7 + 's';
                hero.appendChild(silver);
            }
        })();
    </script>
</body>
</html>
